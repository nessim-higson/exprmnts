<style>
/* ---------- tokens ---------- */
:root{
  --hn:'Helvetica Neue','HelveticaNeue',Helvetica,Arial,sans-serif;
  --bg:#F1F0EC; --ink:#0E0E0E; --mute:#9B9993; --line:rgba(14,14,14,.10); --accent:#E8321F;
  --fs:96px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0B0B0B; --ink:#F0EFEA; --mute:#6F6D68; --line:rgba(240,239,234,.11); --accent:#FF4A2E; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#0B0B0B; --ink:#F0EFEA; --mute:#6F6D68; --line:rgba(240,239,234,.11); --accent:#FF4A2E; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%; margin:0; background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none}
body{font-family:var(--hn); font-kerning:normal; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; transition:background .4s}

#field{display:none}
#wall,#surface{position:fixed; inset:0; width:100%; height:100%; pointer-events:none}
#wall{z-index:0} #surface{z-index:1}
/* the words stay in the DOM for hit-testing, focus and screen readers; the canvas draws them as holes */
#world .item, #world .item.red{color:transparent; -webkit-text-stroke-color:transparent}
.item sup{color:var(--mute)}
#spine{z-index:2}
#spine{position:fixed; top:0; bottom:0; left:0; width:1px; background:var(--line); z-index:1; pointer-events:none; opacity:0; transition:opacity .8s}
#world{position:fixed; left:0; top:0; z-index:2; opacity:0; transition:opacity .6s}
#world.ready{opacity:1}
#world.ready ~ #spine{opacity:1}

/* the grid, on G: twelve columns and a 4px baseline, the way the page is actually set */
#grid{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0; transition:opacity .3s;
  background-image:linear-gradient(to bottom, var(--line) 1px, transparent 1px);
  background-size:100% 8px}
#grid i{position:absolute; top:0; bottom:0; background:rgba(232,50,31,.05); border-left:1px solid rgba(232,50,31,.18); border-right:1px solid rgba(232,50,31,.18)}
#grid.on{opacity:1}

/* ---------- the nav ---------- */
.col{position:absolute; left:0; top:0; display:flex; flex-direction:column; align-items:flex-start; transform-origin:0 0}
.col.root{align-items:flex-end}
/* one face, one weight: Helvetica Neue Light, and the stroke supplies every weight above it, continuously */
.item{all:unset; display:block; position:relative; cursor:pointer; white-space:nowrap;
  font:300 var(--fs)/.87 var(--hn); color:var(--ink); padding:.045em 0 .015em;
  -webkit-text-stroke:var(--sw,0em) currentColor; paint-order:stroke fill;
  transform-origin:0 50%; will-change:transform,opacity}
.item.red{color:var(--accent)}
.item sup{font:400 .165em/1 var(--hn); -webkit-text-stroke:0; letter-spacing:0; vertical-align:top; position:relative; top:.56em; margin-left:.3em;
  color:var(--mute); font-variant-numeric:tabular-nums}
.item.red sup{color:var(--accent); opacity:.55}
/* catalogue numbers hang in the gutter of the live column */
.item[data-n]::before{content:attr(data-n); position:absolute; right:calc(100% + .62em); top:.62em; font:400 .145em/1 var(--hn); -webkit-text-stroke:0;
  letter-spacing:0; color:var(--mute); font-variant-numeric:tabular-nums; opacity:0; transition:opacity .4s}
.col.live .item[data-n]::before{opacity:1}
.item:focus-visible{outline:1.5px solid var(--accent); outline-offset:.06em}

/* ---------- copy ---------- */
#copy{position:fixed; left:0; top:0; z-index:3; width:min(31rem, calc(100vw - 32px)); overflow-y:auto; scrollbar-width:none;
  font:400 15px/1.5 var(--hn); color:var(--ink); visibility:hidden}
#copy::-webkit-scrollbar{display:none}
#copy.scroll{mask-image:linear-gradient(#000 calc(100% - 40px), transparent); -webkit-mask-image:linear-gradient(#000 calc(100% - 40px), transparent)}
#copy.on{visibility:visible}
#copy .lab{display:flex; gap:1.2em; align-items:baseline; font:500 12px/1.2 var(--hn); color:var(--ink); margin-bottom:1.15em}
#copy .lab span{color:var(--accent); font-weight:400; font-variant-numeric:tabular-nums}
#copy p{margin:0 0 .9em; max-width:44ch; text-wrap:pretty; hanging-punctuation:first}
#copy .w{display:inline-block; opacity:0; transform:translateY(.55em);
  transition:opacity .5s ease, transform .75s cubic-bezier(.16,.84,.24,1)}
#copy.on .w{opacity:1; transform:none}
#copy.leaving{opacity:0; transition:opacity .16s}

/* ---------- chrome ---------- */
.bar{position:fixed; left:var(--M,24px); right:var(--M,24px); z-index:6; display:flex; justify-content:space-between; align-items:center; gap:20px;
  font:400 12px/1.2 var(--hn); color:var(--mute)}
.bar.top{top:max(14px, env(safe-area-inset-top))}
.bar.bot{bottom:max(12px, env(safe-area-inset-bottom))}
.bar a,.bar button{all:unset; cursor:pointer; padding:8px 0; transition:color .2s}
.bar a:hover,.bar button:hover,.bar a:focus-visible,.bar button:focus-visible{color:var(--ink)}
.bar :focus-visible{outline:1.5px solid var(--accent); outline-offset:2px}
.bar .grp{display:flex; gap:18px; align-items:center; min-width:0}
.bar b{font-weight:500; color:var(--ink)}
.bar .sep{opacity:.5}
#path{display:flex; gap:6px; align-items:center; min-width:0; overflow:hidden; white-space:nowrap}
#path button.cur{color:var(--ink)}
#path .sl{opacity:.45}

#dna{position:fixed; right:var(--M,24px); bottom:52px; z-index:7; width:250px; padding:16px 16px 10px;
  background:color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line); border-radius:2px; font:400 11px/1.3 var(--hn); color:var(--mute); display:none}
#dna.open{display:block}
#dna .seg{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); overflow:hidden; margin-bottom:14px}
#dna .seg button{all:unset; text-align:center; padding:7px 0; cursor:pointer}
#dna .seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
#dna label{display:grid; grid-template-columns:64px 1fr 34px; align-items:center; gap:10px; margin:0 0 10px}
#dna input{width:100%; accent-color:var(--accent); height:14px}
#dna output{text-align:right; font-variant-numeric:tabular-nums; color:var(--ink)}
#dna .note{margin:4px 0 4px; line-height:1.45; opacity:.8}

@media (max-width:720px){
  .bar .wide{display:none}
  #copy{font-size:14.5px}
  #dna{left:var(--M,16px); right:var(--M,16px); width:auto}
}

  <label>Tension <input type="range" id="k" min="60" max="420" step="5"><output></output></label>

  <label>Ladder <input type="range" id="ladder" min="0.3" max="0.85" step="0.01"><output></output></label>
  <label>Cascade <input type="range" id="cascade" min="0" max="140" step="2"><output></output></label>
  <div class="note">Ease · 2003 is the original engine: <i>x += (goal − x) / 3</i> at 60fps, snapping when within a pixel.</div>

<script src="../text-nav-2027/tree.js"></script>
<script>
/* =====================================================================
   TEXT NAV, 2027 — after Firstborn (2003)
   What is kept from '03: right-aligned stack, children hanging off the
   selected item's edge, ancestors receding as one organism (the ladder),
   arrival-gated choreography (retract -> tuck -> cascade -> copy), the
   thumbnail field that the portfolio sorts re-home.
   What is new: the ladder is a variable-font axis (ancestors condense and
   lighten, not just shrink), real springs with follow-through, a camera
   that follows the newest column, deep links, keyboard, a living field.
   ===================================================================== */
const TREE = window.TREE;
const $ = s => document.querySelector(s);
const world = $('#world'), copyEl = $('#copy'), spineEl = $('#spine'), pathEl = $('#path');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const P = { engine:'spring', k:200, z:.72, ladder:.5, cascade:44 };
if (reduce){ P.k = 420; P.z = 1; P.cascade = 0; }

/* the axis map: the ladder is typographic */
/* the ladder in Helvetica: Light for everything, the stroke adds weight continuously (em of the item's own size).
   With paint-order stroke-under-fill the stem gains exactly the stroke width:
   0 = Light 300 · .02 ≈ Regular · .042 ≈ Medium · .07 ≈ Bold. Tracking opens as the size falls. */
const AX = {
  sw:  g => g===0 ? 0.06 : 0,             // live column a Bold window, ancestors a Light hairline
  sc:  g => 1/(1 + (1/P.ladder - 1)*g),   // 1, .5, .33, .25 at ladder .5
  ls:  s => -0.052 + 0.046*Math.min(1, Math.max(0, (1 - s)/0.75)),   // −.052em at full size → −.006em when small
};
const SEL_SW = 0.05, HOVER_SW = 0.035;

/* sentence case, with the proper nouns the 2003 copy uses */
const KEEP = ['Firstborn','Michael','Ferdman','Vas','Sloutchevsky','Redken','Madonna','Federated','Calvin','Klein','PR','CD-ROMs','A–Z','T-shirt','CD'];
function nice(label){
  if (/^\d{4}$/.test(label)) return label;
  let t = label.toLowerCase().replace('(a-z)','(A–Z)').replace('cd-roms','CD-ROMs').replace('t-shirt','T-shirt').replace('marketing/pr','marketing/PR').replace(/\bcd\b/,'CD');
  KEEP.forEach(k => { t = t.replace(new RegExp('\\b'+k.toLowerCase().replace(/[-–]/g,'.')+'\\b','g'), k); });
  return t.charAt(0).toUpperCase() + t.slice(1);
}

/* ---------- one value type for both engines ---------- */
class V{
  constructor(v, eps){ this.v=v; this.t=v; this.u=0; this.eps=eps; }
  set(v){ this.v=this.t=v; this.u=0; }
  step(h){
    const d = this.t - this.v;
    if (P.engine==='03'){                         // the 2003 engine, verbatim in spirit
      if (Math.abs(d) <= this.eps){ this.v=this.t; this.u=0; return; }
      this.v += d*(1 - Math.pow(2/3, h*60)); this.u=0; return;
    }
    const c = 2*Math.sqrt(P.k)*P.z;
    this.u += (P.k*d - c*this.u)*h;
    this.v += this.u*h;
    if (Math.abs(this.t-this.v) < this.eps*.05 && Math.abs(this.u) < this.eps*.5){ this.v=this.t; this.u=0; }
  }
  near(f=1){ return Math.abs(this.t-this.v) <= this.eps*f && Math.abs(this.u) <= this.eps*f*40; }
}

/* ---------- state ---------- */
let W=0, H=0, M=24, FS=96;
let levels = [], dead = [];
let want = [];                 // the path we want open: [i0, i1, ...]
let hover = null, kbd = false;
const cam = { x:new V(0,1), y:new V(0,1) };
let copyFor = null, copyShown = null, copyMode = 'below', inPortfolio = false;

const slug = s => s.toLowerCase().replace(/!/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const nodeAt = (path) => { let ns=TREE, n=null; for (const i of path){ n = ns && ns[i]; if(!n) return null; ns = n.children; } return n; };

/* ---------- levels ---------- */
function makeLevel(nodes, depth, red){
  const el = document.createElement('div');
  el.className = 'col' + (depth===0 ? ' root' : '');
  world.appendChild(el);
  const L = { el, nodes, depth, red, items:[], sel:-1, born:clock, died:0,
    s:new V(1,.004), x:new V(0,1), y:new V(0,1), sw:new V(AX.sw(0),.0005), w:0, h:0, ls:'' };
  nodes.forEach((n,i)=>{
    const b = document.createElement('button');
    b.type='button'; b.className = 'item' + ((red||n.red)?' red':'');
    const lab = document.createElement('span'); lab.textContent = nice(n.label); b.appendChild(lab);
    if (depth>0) b.dataset.n = String(i+1).padStart(2,'0');
    if (n.children){ const s=document.createElement('sup'); s.textContent=n.children.length; b.appendChild(s);
      b.setAttribute('aria-expanded','false'); }
    el.appendChild(b);
    const it = { el:b, node:n, i, e:new V(0,.01), o:new V(1,.01), h:new V(0,.01), k:new V(0,.01), left:0, top:0, w:0, fv:'' };
    b.addEventListener('click', ev=>{ ev.stopPropagation(); kbd = ev.detail===0; pick(L, i); });
    b.addEventListener('pointerenter', ev=>{ if (ev.pointerType==='mouse') hover = it; });
    b.addEventListener('pointerleave', ()=>{ if (hover===it) hover = null; });
    L.items.push(it);
  });
  return L;
}
function retire(L){ L.died = clock; dead.push(L); }

function pick(L, i){
  const d = levels.indexOf(L); if (d<0) return;
  if (want[d]===i && want.length===d+1) want = want.slice(0,d);   // tap the open one again: fold it
  else want = want.slice(0,d).concat(i);
  writeHash();
}
function up(){
  if (!want.length) return;
  const d = want.length-1, i = want[d];
  want = want.slice(0,d); writeHash();
  if (kbd && levels[d]) levels[d].items[i].el.focus({preventScroll:true});
}

/* ---------- reconcile: the choreography, state-driven ---------- */
function reconcile(now){
  // 1. selections follow `want`; a changed selection retracts everything deeper first
  for (let d=0; d<levels.length; d++){
    const L = levels[d], w = (want[d]===undefined) ? -1 : want[d];
    if (L.sel !== w){
      levels.splice(d+1).forEach(retire);
      L.sel = w;
      L.items.forEach((it,j)=> it.node.children && it.el.setAttribute('aria-expanded', String(j===w)));
      break;
    }
  }
  // 2. spawn: only once the old branch is gone AND the selection has arrived (reorganise, then reveal)
  const top = levels[levels.length-1];
  if (top.sel>=0 && !dead.length){
    const n = top.nodes[top.sel], it = top.items[top.sel];
    if (n.children && it.k.near(3) && it.e.near(6) && top.x.near(4) && top.s.near(6)){
      const NL = makeLevel(n.children, levels.length, top.red || n.red);
      const r = selRight(top);
      NL.x.set(r + gapFor()); NL.y.set(top.y.v + it.top*top.s.v); NL.s.set(.62);
      NL.sw.set(0);
      levels.push(NL);
      if (kbd) requestAnimationFrame(()=> NL.items[0].el.focus({preventScroll:true}));
    }
  }
  // 3. which node's words should be showing
  const p0 = want.length ? TREE[want[0]] : null;
  inPortfolio = !!(p0 && p0.label.includes('PORTFOLIO'));
  const deepest = want.length ? nodeAt(want) : null;
  // in the portfolio the work does the talking; on small screens the words step out of its way
  const target = deepest && deepest.copy && !(inPortfolio && W < 900) ? deepest : null;
  if (target !== copyFor){ copyFor = target; hideCopy(); }
  if (copyFor && copyShown !== copyFor && settled()) showCopy(copyFor);
  // 4. field mood
  if (inPortfolio){
    const sort = want.length>1 ? TREE[want[0]].children[want[1]] : null;
    setMood('portfolio', sort ? sort.layout : 'scatter');
  } else setMood(want.length ? 'dim' : 'home');
}
function settled(){
  if (dead.length) return false;
  const top = levels[levels.length-1];
  if (top.sel>=0 && top.nodes[top.sel].children) return false;   // a branch is still on its way
  if (!top.items.every(it=>it.e.v>.9)) return false;
  return top.x.near(6) && top.s.near(10) && cam.x.near(8);
}

/* ---------- geometry ---------- */
const gapFor = () => FS*.2;
function selRight(L){
  const it = L.items[L.sel];
  // children hang off the column's edge, not the word's: every column is a clean vertical axis
  return L.x.v + L.w*L.s.v + it.k.v*.14*FS*L.s.v;
}
function measure(){
  for (const L of levels.concat(dead)){
    L.w = L.el.offsetWidth; L.h = L.el.offsetHeight;
    for (const it of L.items){ it.left = it.el.offsetLeft; it.top = it.el.offsetTop; it.w = it.el.offsetWidth; }
  }
}
function targets(now){
  const n = levels.length;
  levels.forEach((L,d)=>{
    const g = n-1-d;
    L.sw.t = AX.sw(g); L.el.classList.toggle('live', g===0 && d>0);
    let fit = 1;
    if (g===0 && L.w){
      // prefer shrinking into the room to the right of the ancestors; only below 60% does the camera pan instead
      const roomFit = (W - M - (d ? L.x.t : M))/L.w;
      const fullFit = Math.min(1, (W - 2*M)/L.w);
      fit = Math.min(1, Math.max(roomFit, fullFit*.6), (H - 150)/Math.max(1,L.h));
      if (inPortfolio) fit = Math.min(fit, (W*(W < 720 ? .92 : .3))/L.w, (H*(W < 720 ? .3 : .55))/Math.max(1,L.h));
    }
    L.s.t = AX.sc(g)*fit;
    if (d===0){ L.x.t = M; L.y.t = topY(); }
    else {
      const p = levels[d-1], pit = p.items[p.sel];
      L.x.t = selRight(p) + gapFor()*Math.min(1, L.s.v*1.4);
      L.y.t = p.y.v + pit.top*p.s.v;
    }
    const hasSel = L.sel>=0;
    L.items.forEach((it,i)=>{
      it.e.t = (now - L.born >= i*P.cascade) ? 1 : 0;
      it.k.t = (i===L.sel) ? 1 : 0;
      it.o.t = !hasSel ? (g===0 ? 1 : .55) : (i===L.sel ? 1 : (g===0 ? .3 : .22));
      it.h.t = (hover===it || (kbd && document.activeElement===it.el)) ? 1 : 0;
    });
  });
  for (const L of dead){
    const nI = L.items.length;
    L.items.forEach((it,i)=>{ it.e.t = (now - L.died >= (nI-1-i)*P.cascade*.5) ? 0 : 1; it.h.t=0; });
  }
  // camera: follow the newest column (and its words)
  const top = levels[n-1];
  const right = top.x.t + top.w*top.s.t;
  const wantRight = copyMode==='right' && copyFor ? right + 40 + copyW() : right;
  cam.x.t = Math.min(0, (W - M) - wantRight);
  let bottom = Math.max(...levels.map(L=>L.y.t + L.h*L.s.t));
  if (copyFor && copyMode==='below') bottom += 28 + Math.min(260, H*.36);
  cam.y.t = Math.min(0, (H - 56) - bottom);
}
function topY(){
  const r = levels[0];
  const h = (r ? r.h : FS*5.5) * (r ? r.s.t : 1);
  return Math.max(70, (H - h)*.4);
}
const copyW = () => Math.min(31*16, W - 2*M);

/* ---------- physics ---------- */
const HSTEP = 1/120;
function stepAll(h){
  for (const L of levels.concat(dead)){
    L.s.step(h); L.x.step(h); L.y.step(h); L.sw.step(h);
    for (const it of L.items){ it.e.step(h); it.o.step(h); it.h.step(h); it.k.step(h); }
  }
  cam.x.step(h); cam.y.step(h);
}

/* ---------- render ---------- */
function render(){
  world.style.transform = `translate3d(${cam.x.v.toFixed(2)}px,${cam.y.v.toFixed(2)}px,0)`;
  for (const L of levels.concat(dead)){
    L.el.style.transform = `translate3d(${L.x.v.toFixed(2)}px,${L.y.v.toFixed(2)}px,0) scale(${L.s.v.toFixed(4)})`;
    const ls = AX.ls(L.s.v).toFixed(4)+'em'; if (ls !== L.ls){ L.el.style.letterSpacing = ls; L.ls = ls; }
    for (const it of L.items){
      const e = Math.max(0, Math.min(1.08, it.e.v));
      const ty = -it.top*(1-e);                                    // born folded onto the first row, then cascades
      const tx = it.k.v*.14*FS + it.h.v*.035*FS;
      const op = Math.max(0, Math.min(1, e)) * (it.o.v + it.h.v*(1-it.o.v)*.75);
      it.el.style.transform = `translate3d(${tx.toFixed(2)}px,${ty.toFixed(2)}px,0)`;
      it.el.style.opacity = op.toFixed(3);
      const sw = Math.max(0, L.sw.v + it.k.v*SEL_SW + it.h.v*HOVER_SW);
      const fv = sw.toFixed(4);
      if (fv !== it.fv){ it.el.style.setProperty('--sw', fv+'em'); it.fv = fv; }
      it.el.style.pointerEvents = e > .5 && !L.died ? '' : 'none';
    }
  }
  // remove what has fully folded away
  dead = dead.filter(L=>{
    if (L.items.every(it=>it.e.v < .03 && it.e.t===0)){ L.el.remove(); return false; }
    return true;
  });
  // the spine: the root's right-aligned edge, made visible
  const r = levels[0];
  spineEl.style.transform = `translateX(${(cam.x.v + r.x.v + r.w*r.s.v + 1).toFixed(1)}px)`;
  placeCopy();
}

/* ---------- copy ---------- */
function hideCopy(){
  if (!copyShown) return;
  copyShown = null;

function bestGrid(n, rw, rh, gap, extraRows=0, extraH=0){

    const tw = (rw - (cols-1)*gap)/cols; if (tw<6) break;

const GROUP_T = ['Marketing','Communications','Sales','Training'];
const GROUP_M = ['Web sites','CD-ROMs','Intranets'];
function portfolioTargets(){
  const R = region(), rw = R.x1-R.x0, rh = R.y1-R.y0, gap = Math.max(3, Math.min(8, rw/160));
  const out = new Array(tiles.length); labels = [];

const FK = 70, FZ = .82;
function field(dt, now){

    if (!t.ready) continue;

    if (pt){ ({x:tx, y:ty, w:tw} = pt[t.i]); ta = 1; tc = 1;
      if (layout==='scatter' && !reduce){ tx += Math.sin(t0*.35+t.ph)*4; ty += Math.cos(t0*.3+t.ph)*3; }
    } else {

      ty = t.v*H + (-ptr.ny*24*depth) + Math.cos(t0*.1+t.ph)*7*drift;

    advance(sec){ for (let i=0; i<sec*60; i++) tick(last + 1000/60); } };

}
